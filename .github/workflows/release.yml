name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            archive: tar.gz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        shell: bash
        run: |
          name="termcode-${{ matrix.target }}"
          mkdir -p "dist/${name}"

          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp "target/${{ matrix.target }}/release/termcode.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/termcode" "dist/${name}/"
          fi

          cp -r runtime "dist/${name}/"
          cp LICENSE "dist/${name}/"
          cp README.md "dist/${name}/"

          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "../${name}.zip" "${name}"
          else
            tar czf "../${name}.tar.gz" "${name}"
          fi

      # One line per archive, collected into a single sha256sums.txt below.
      # install.sh verifies the archive against it before unpacking, so a
      # truncated download or a swapped file is caught rather than installed.
      - name: Checksum
        shell: bash
        run: |
          archive="termcode-${{ matrix.target }}.${{ matrix.archive }}"
          # macOS runners have shasum but no sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          cat "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: termcode-${{ matrix.target }}
          path: |
            termcode-*.${{ matrix.archive }}
            termcode-*.${{ matrix.archive }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Collect checksums
        run: |
          cat termcode-*.sha256 > sha256sums.txt
          rm -f termcode-*.sha256
          cat sha256sums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            termcode-*.tar.gz
            termcode-*.zip
            sha256sums.txt
